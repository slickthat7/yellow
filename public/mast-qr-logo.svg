<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Top 5 Golden Stars -->
  <g fill="url(#goldGrad)">
    <!-- Star 1 (far left) -->
    <path transform="translate(160, 105) scale(0.65)" d="M15,0 L19.6,9.4 L30,10.9 L22.5,18.2 L24.3,28.5 L15,23.6 L5.7,28.5 L7.5,18.2 L0,10.9 L10.4,9.4 Z" />
    <!-- Star 2 (mid left) -->
    <path transform="translate(200, 80) scale(0.8)" d="M15,0 L19.6,9.4 L30,10.9 L22.5,18.2 L24.3,28.5 L15,23.6 L5.7,28.5 L7.5,18.2 L0,10.9 L10.4,9.4 Z" />
    <!-- Star 3 (center peak) -->
    <path transform="translate(240, 60) scale(1.0)" d="M15,0 L19.6,9.4 L30,10.9 L22.5,18.2 L24.3,28.5 L15,23.6 L5.7,28.5 L7.5,18.2 L0,10.9 L10.4,9.4 Z" />
    <!-- Star 4 (mid right) -->
    <path transform="translate(285, 80) scale(0.8)" d="M15,0 L19.6,9.4 L30,10.9 L22.5,18.2 L24.3,28.5 L15,23.6 L5.7,28.5 L7.5,18.2 L0,10.9 L10.4,9.4 Z" />
    <!-- Star 5 (far right) -->
    <path transform="translate(325, 105) scale(0.65)" d="M15,0 L19.6,9.4 L30,10.9 L22.5,18.2 L24.3,28.5 L15,23.6 L5.7,28.5 L7.5,18.2 L0,10.9 L10.4,9.4 Z" />
  </g>

  <!-- Central Purple QR Frame -->
  <rect x="175" y="125" width="150" height="150" rx="28" fill="none" stroke="#4C1D95" stroke-width="12" />

  <!-- QR Code Inside -->
  <!-- Top Left Finder Pattern -->
  <rect x="202" y="152" width="26" height="26" fill="none" stroke="#4C1D95" stroke-width="6" rx="4" />
  <rect x="210" y="160" width="10" height="10" fill="#4C1D95" />

  <!-- Top Right Finder Pattern -->
  <rect x="268" y="152" width="26" height="26" fill="none" stroke="#4C1D95" stroke-width="6" rx="4" />
  <rect x="276" y="160" width="10" height="10" fill="#4C1D95" />

  <!-- Bottom Right Finder Pattern -->
  <rect x="268" y="218" width="26" height="26" fill="none" stroke="#4C1D95" stroke-width="6" rx="4" />
  <rect x="276" y="226" width="10" height="10" fill="#4C1D95" />

  <!-- Middle QR Data Bits -->
  <rect x="235" y="162" width="6" height="6" fill="#4C1D95" />
  <rect x="245" y="162" width="6" height="6" fill="#4C1D95" />
  <rect x="240" y="175" width="7" height="7" fill="#4C1D95" />
  <rect x="220" y="190" width="8" height="8" fill="#4C1D95" />
  <rect x="232" y="188" width="8" height="14" fill="#4C1D95" />
  <rect x="245" y="192" width="12" height="6" fill="#4C1D95" />
  <rect x="260" y="185" width="7" height="12" fill="#4C1D95" />
  <rect x="220" y="205" width="14" height="6" fill="#4C1D95" />
  <rect x="240" y="210" width="10" height="10" fill="#4C1D95" />
  <rect x="255" y="208" width="8" height="12" fill="#4C1D95" />
  <rect x="235" y="225" width="8" height="8" fill="#4C1D95" />

  <!-- Gold Accent Block in QR -->
  <rect x="288" y="190" width="9" height="9" fill="url(#goldGrad)" rx="2" />

  <!-- Person Mascot (Purple) -->
  <circle cx="170" cy="245" r="18" fill="#4C1D95" />
  <path d="M152,298 C152,275 162,268 185,268 C192,268 200,270 205,274 L225,248 C228,244 234,245 236,250 C238,255 235,260 230,265 L205,290 C205,294 205,298 205,298 Z" fill="#4C1D95" />

  <!-- Stand / Base under frame -->
  <path d="M225,275 L285,250 L270,275 Z" fill="#4C1D95" />

  <!-- Upward Sweeping Golden Growth Arrow -->
  <path d="M210,285 C270,285 335,250 375,170 L360,165 L400,140 L395,185 L382,180 C345,260 275,295 210,285 Z" fill="url(#goldGrad)" />

  <!-- Typography: MAST in Deep Purple, QR in Gold -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" letter-spacing="1">
    <text x="45" y="385" fill="#3B0764">MAST</text>
    <text x="340" y="385" fill="#F59E0B">QR</text>
  </g>

  <!-- Subtitle with Dividers -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="2.5">
    <line x1="45" y1="412" x2="105" y2="412" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round" />
    <text x="115" y="417" fill="#3B0764">SCAN</text>
    <circle cx="178" cy="412" r="3.5" fill="#F59E0B" />
    <text x="190" y="417" fill="#3B0764">RATE</text>
    <circle cx="258" cy="412" r="3.5" fill="#F59E0B" />
    <text x="270" y="417" fill="#3B0764">IMPROVE</text>
    <circle cx="376" cy="412" r="3.5" fill="#F59E0B" />
    <text x="388" y="417" fill="#3B0764">GROW</text>
    <line x1="460" y1="412" x2="490" y2="412" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
